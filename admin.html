<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAN Admin</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Shared Styles */
        :root { --primary: #006064; --bg: #f0f2f5; --sidebar: #1a1a1a; --text: #333; --white: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; color: var(--text); }
        
        /* PIN SCREEN */
        .pin-screen { position: fixed; width: 100%; height: 100%; background: var(--primary); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .pin-box { background: white; padding: 40px; border-radius: 8px; width: 300px; text-align: center; }
        .pin-input { font-size: 24px; letter-spacing: 5px; text-align: center; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; }
        .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }

        /* DASHBOARD LAYOUT */
        .sidebar { width: 250px; background: var(--sidebar); color: white; padding: 20px; display: flex; flex-direction: column; }
        .nav-item { padding: 12px; cursor: pointer; color: #aaa; display: flex; gap: 10px; align-items: center; }
        .nav-item.active { background: var(--primary); color: white; border-radius: 6px; }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; display: none; } /* Hidden by default */
        .header { background: white; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        
        .content { padding: 20px; overflow-y: auto; flex: 1; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px; }
        
        .tab-view { display: none; }
        .tab-view.active { display: block; }

        @media(max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { display: none; } 
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="pin-screen" id="pinScreen">
        <div class="pin-box">
            <h2>SAN Admin</h2>
            <p>Enter PIN</p>
            <input type="password" id="pinInput" class="pin-input" maxlength="6">
            <button class="btn" style="width:100%" onclick="checkPin()">Access</button>
        </div>
    </div>

    <div class="sidebar">
        <h3>SAN Admin</h3>
        <div class="nav-item active" onclick="tab('settings')"><i class="fa-solid fa-gear"></i> Settings</div>
        <div class="nav-item" onclick="tab('products')"><i class="fa-solid fa-box"></i> Products</div>
        <div class="nav-item" onclick="tab('invoices')"><i class="fa-solid fa-file"></i> Invoices</div>
    </div>

    <div class="main" id="mainApp">
        <div class="header">
            <h2 id="pageTitle">Company Settings</h2>
            <button class="btn" onclick="saveData()"><i class="fa-solid fa-save"></i> Save Changes</button>
        </div>

        <div class="content">
            
            <div id="settings" class="tab-view active">
                <div class="card">
                    <h3>Branding</h3>
                    <div class="form-grid">
                        <div><label>Company Name</label><input type="text" id="setCompany"></div>
                        <div><label>Logo URL</label><input type="text" id="setLogo"></div>
                    </div>
                </div>
                <div class="card">
                    <h3>Bank & Tax</h3>
                    <div class="form-grid">
                        <div><label>Bank Name</label><input type="text" id="setBank"></div>
                        <div><label>IBAN</label><input type="text" id="setIban"></div>
                        <div><label>Tax ID</label><input type="text" id="setTaxId"></div>
                        <div><label>VAT ID</label><input type="text" id="setVatId"></div>
                    </div>
                </div>
                <div class="card">
                    <h3>Address & Contact</h3>
                    <div class="form-grid">
                        <div><label>Address</label><textarea id="setAddress" rows="3"></textarea></div>
                        <div><label>Footer Contact</label><textarea id="setContact" rows="3"></textarea></div>
                    </div>
                </div>
            </div>

            <div id="products" class="tab-view">
                <div class="card">
                    <h3>Product Catalog</h3>
                    <button class="btn" onclick="addProd()" style="margin-bottom:10px;">+ Add Product</button>
                    <table style="width:100%; text-align:left;">
                        <thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                        <tbody id="prodBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="invoices" class="tab-view">
                <div class="card">
                    <h3>Invoice History</h3>
                    <ul id="invList" style="list-style:none; padding:0;"></ul>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- 1. CONFIGURATION (BACKEND) ---
    const SECRET_CONFIG = {
        owner: "YOUR_GITHUB_USERNAME", 
        repo:  "YOUR_REPO_NAME",
        token: "YOUR_PAT_TOKEN"
    };

    let appState = { data: { settings: {}, products: [], invoices: [] }, sha: null };
    const DEFAULT_PIN = "110327";

    // --- PIN LOGIC ---
    function checkPin() {
        const input = document.getElementById('pinInput').value;
        const pinData = JSON.parse(localStorage.getItem('san_pin_data')) || { pin: DEFAULT_PIN };
        if(input === pinData.pin) {
            document.getElementById('pinScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            fetchData();
        } else {
            alert("Wrong PIN");
        }
    }

    // --- DATA ---
    async function fetchData() {
        const url = `https://api.github.com/repos/${SECRET_CONFIG.owner}/${SECRET_CONFIG.repo}/contents/db.json`;
        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${SECRET_CONFIG.token}` } });
            if(res.status === 404) return;
            const json = await res.json();
            appState.sha = json.sha;
            appState.data = JSON.parse(decodeURIComponent(escape(window.atob(json.content))));
            render();
        } catch(e) { alert("Connect Error: Check config in code"); }
    }

    async function saveData() {
        // Collect Settings
        appState.data.settings = {
            company: document.getElementById('setCompany').value,
            logo: document.getElementById('setLogo').value,
            bank: document.getElementById('setBank').value,
            iban: document.getElementById('setIban').value,
            taxId: document.getElementById('setTaxId').value,
            vatId: document.getElementById('setVatId').value,
            address: document.getElementById('setAddress').value,
            contact: document.getElementById('setContact').value
        };

        // Collect Products
        appState.data.products = Array.from(document.querySelectorAll('#prodBody tr')).map(tr => ({
            name: tr.querySelector('.p-name').value,
            price: tr.querySelector('.p-price').value
        })).filter(p => p.name);

        const url = `https://api.github.com/repos/${SECRET_CONFIG.owner}/${SECRET_CONFIG.repo}/contents/db.json`;
        
        // Refresh SHA
        try {
            const check = await fetch(url, { headers: { 'Authorization': `token ${SECRET_CONFIG.token}`, 'Cache-Control': 'no-cache' } });
            if(check.ok) appState.sha = (await check.json()).sha;
        } catch(e) {}

        const body = {
            message: "Admin Update",
            content: window.btoa(unescape(encodeURIComponent(JSON.stringify(appState.data, null, 2)))),
            sha: appState.sha
        };

        await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${SECRET_CONFIG.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        alert("Saved!");
    }

    // RENDER
    function render() {
        const s = appState.data.settings || {};
        document.getElementById('setCompany').value = s.company || '';
        document.getElementById('setLogo').value = s.logo || '';
        document.getElementById('setBank').value = s.bank || '';
        document.getElementById('setIban').value = s.iban || '';
        document.getElementById('setTaxId').value = s.taxId || '';
        document.getElementById('setVatId').value = s.vatId || '';
        document.getElementById('setAddress').value = s.address || '';
        document.getElementById('setContact').value = s.contact || '';

        const pb = document.getElementById('prodBody');
        pb.innerHTML = '';
        (appState.data.products || []).forEach(p => addProd(p));

        const il = document.getElementById('invList');
        il.innerHTML = (appState.data.invoices || []).map(i => 
            `<li style="padding:10px; border-bottom:1px solid #eee;">
                <strong>${i.id}</strong> - ${i.total} (${i.date})
            </li>`
        ).reverse().join('');
    }

    function addProd(p = {name:'', price:''}) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input class="p-name" value="${p.name}"></td>
            <td><input class="p-price" value="${p.price}"></td>
            <td><button onclick="this.closest('tr').remove()">X</button></td>
        `;
        document.getElementById('prodBody').appendChild(tr);
    }

    function tab(id) {
        document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
