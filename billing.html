<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAN Billing</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #006064; --accent: #00BCD4; --bg: #f4f7f6; --text: #1a1a1a; --white: #ffffff; --danger: #d32f2f; --success: #2e7d32; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        /* --- LAYOUT --- */
        .app-container { width: 100%; max-width: 210mm; display: none; flex-direction: column; gap: 15px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- PIN SCREEN --- */
        .pin-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .pin-box { background: white; padding: 30px; border-radius: 12px; width: 300px; text-align: center; color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .pin-input { font-size: 24px; letter-spacing: 5px; text-align: center; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; }
        .pin-msg { color: var(--danger); font-size: 12px; height: 15px; margin-bottom: 5px; }

        /* --- CONTROLS --- */
        .controls-bar { background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 10px; border-top: 4px solid var(--accent); align-items: center; }
        .control-group { display: flex; gap: 8px; flex: 1; min-width: 200px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; justify-content: center; }
        .btn:hover { background: #004d50; }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        
        /* --- PAPER & INVOICE --- */
        .paper { background: var(--white); width: 100%; min-height: 297mm; padding: 40px; border-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .inv-header { display: flex; justify-content: space-between; margin-bottom: 40px; border-bottom: 2px solid var(--primary); padding-bottom: 20px; flex-wrap: wrap; gap: 20px; }
        .company-brand h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .inv-meta { text-align: right; }
        .address-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
        .addr-box h3 { font-size: 11px; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .addr-content textarea { width: 100%; border: 1px dashed #ccc; padding: 10px; background: #fafafa; font-family: inherit; font-size: 14px; resize: none; }
        
        /* --- TABLE --- */
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 20px; }
        .items-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .items-table th { background: var(--primary); color: white; text-align: left; padding: 10px; font-size: 12px; }
        .items-table td { border-bottom: 1px solid #eee; padding: 8px; vertical-align: top; }
        .items-table input { width: 100%; border: none; background: transparent; padding: 5px; }
        
        .totals-section { display: flex; justify-content: flex-end; margin-top: 20px; }
        .totals-box { width: 280px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
        .total-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; }
        .total-row.grand { font-size: 18px; font-weight: bold; border-top: 2px solid #ddd; margin-top: 10px; padding-top: 10px; color: var(--primary); }
        .legal-text { font-size: 11px; color: #666; font-style: italic; margin-top: 10px; text-align: right; }
        
        .footer { margin-top: 50px; border-top: 1px solid #ddd; padding-top: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; font-size: 10px; color: #777; }
        
        /* --- MOBILE --- */
        @media screen and (max-width: 768px) {
            body { padding: 0; }
            .paper { padding: 20px; width: 100%; min-height: auto; }
            .inv-header, .address-grid, .footer { flex-direction: column; grid-template-columns: 1fr; text-align: left; }
            .inv-meta { text-align: left; width: 100%; margin-top: 15px; }
            .totals-section { justify-content: center; }
            .controls-bar { position: sticky; top: 0; z-index: 100; border-radius: 0; }
        }

        /* --- PRINT --- */
        @media print {
            .app-container { display: block; max-width: none; }
            .pin-screen, .controls-bar, .no-print { display: none !important; }
            .paper { box-shadow: none; padding: 0; }
            .address-grid { display: grid; grid-template-columns: 1fr 1fr; }
            .inv-header { flex-direction: row; justify-content: space-between; }
            .footer { display: grid; grid-template-columns: 1fr 1fr 1fr; }
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="pin-screen" id="pinScreen">
        <div class="pin-box" id="pinEntry">
            <h2><i class="fa-solid fa-lock"></i> SAN Secure</h2>
            <p>Enter 6-Digit PIN</p>
            <div class="pin-msg" id="pinMsg"></div>
            <input type="password" id="pinInput" class="pin-input" maxlength="6" placeholder="******">
            <button class="btn" style="width:100%;" onclick="checkPin()">Unlock</button>
        </div>
        
        <div class="pin-box hidden" id="pinChange">
            <h2><i class="fa-solid fa-key"></i> Update PIN</h2>
            <p>PIN expired (90 days). Set new PIN.</p>
            <input type="password" id="newPin" class="pin-input" maxlength="6" placeholder="New PIN">
            <button class="btn" style="width:100%;" onclick="updatePin()">Save & Enter</button>
        </div>
    </div>

    <div class="app-container" id="mainApp">
        <div class="controls-bar">
            <div class="control-group">
                <select id="docType" onchange="updateUI()" style="flex:1; padding:8px; border-radius:5px;">
                    <option value="Rechnung">Rechnung</option>
                    <option value="Angebot">Angebot</option>
                </select>
                <select id="taxMode" onchange="calc()" style="flex:1; padding:8px; border-radius:5px;">
                    <option value="klein" selected>§19 Kleinunternehmer (0%)</option>
                    <option value="standard">Standard (19%)</option>
                    <option value="international">International (0%)</option>
                </select>
            </div>
            <div class="control-group">
                <select id="clientSelect" onchange="loadClient()" style="flex:1; padding:8px; border-radius:5px;">
                    <option value="">-- Load Client --</option>
                </select>
                <button class="btn" onclick="saveToGitHub()"><i class="fa-solid fa-cloud-upload"></i> Save</button>
                <button class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> PDF</button>
            </div>
        </div>

        <div class="paper">
            <div class="inv-header">
                <div class="company-brand" id="brandBox">
                    <h1>SAN Technologies</h1>
                    <p>Loading settings...</p>
                </div>
                <div class="inv-meta">
                    <h2 id="displayDocType">RECHNUNG</h2>
                    <p>Nr: <input type="text" id="invNumber" value="INV-2026-001" style="width:100px; padding:5px; border:1px solid #ddd;"></p>
                    <p>Date: <input type="date" id="invDate" style="padding:5px; border:1px solid #ddd;"></p>
                </div>
            </div>

            <div class="address-grid">
                <div class="addr-box">
                    <h3>From</h3>
                    <div class="addr-content" id="senderBox"><p>Loading...</p></div>
                </div>
                <div class="addr-box">
                    <h3>To</h3>
                    <textarea id="clientDetails" rows="4" placeholder="Client Name&#10;Address&#10;City, Country"></textarea>
                    <button class="btn-outline no-print" onclick="quickSaveClient()" style="font-size:10px; margin-top:5px; width:100%;">+ Save to List</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="items-table">
                    <thead><tr><th>Description</th><th style="width:15%; text-align:right;">Qty</th><th style="width:15%; text-align:right;">Price</th><th style="width:15%; text-align:right;">Total</th><th class="no-print" style="width:5%;"></th></tr></thead>
                    <tbody id="itemsBody"></tbody>
                </table>
            </div>
            <button class="btn-outline no-print" style="width:100%; border-style:dashed;" onclick="addItem()">+ Add Item</button>

            <div class="totals-section">
                <div class="totals-box">
                    <div class="total-row"><span>Net:</span><span id="valNet">0.00 €</span></div>
                    <div class="total-row" id="rowTax"><span>VAT (19%):</span><span id="valTax">0.00 €</span></div>
                    <div class="total-row grand"><span>Total:</span><span id="valGrand">0.00 €</span></div>
                    <div class="legal-text" id="legalText">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</div>
                </div>
            </div>

            <div class="footer" id="footerBox">
                <div>Loading footer...</div>
            </div>
        </div>
    </div>

<script>
    // --- 1. CONFIGURATION (BACKEND) ---
    const SECRET_CONFIG = {
        owner: "santechnoin", 
        repo:  "billing-db",
        token: "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"
    };

    let appState = { data: { settings: {}, clients: [], products: [], invoices: [] }, sha: null };
    const DEFAULT_PIN = "110327";

    // --- 2. PIN LOGIC ---
    window.onload = () => {
        const pinData = JSON.parse(localStorage.getItem('san_pin_data')) || { pin: DEFAULT_PIN, date: Date.now() };
        
        // Check Expiry (90 Days)
        const daysOld = (Date.now() - pinData.date) / (1000 * 60 * 60 * 24);
        if(daysOld > 90) {
            document.getElementById('pinEntry').classList.add('hidden');
            document.getElementById('pinChange').classList.remove('hidden');
        }
    };

    function checkPin() {
        const input = document.getElementById('pinInput').value;
        const pinData = JSON.parse(localStorage.getItem('san_pin_data')) || { pin: DEFAULT_PIN };
        
        if(input === pinData.pin) {
            unlockApp();
        } else {
            document.getElementById('pinMsg').innerText = "Incorrect PIN";
            document.getElementById('pinInput').value = "";
        }
    }

    function updatePin() {
        const newPin = document.getElementById('newPin').value;
        if(newPin.length < 4) return alert("PIN too short");
        
        localStorage.setItem('san_pin_data', JSON.stringify({ pin: newPin, date: Date.now() }));
        unlockApp();
    }

    function unlockApp() {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        fetchData(); // Sync DB
        document.getElementById('invDate').valueAsDate = new Date();
        addItem(); 
        calc(); // Init Tax Text
    }

    // --- 3. GITHUB SYNC ---
    async function fetchData() {
        const url = `https://api.github.com/repos/${SECRET_CONFIG.owner}/${SECRET_CONFIG.repo}/contents/db.json`;

        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${SECRET_CONFIG.token}` } });
            if(res.status === 404) return console.log("New DB");
            
            const json = await res.json();
            appState.sha = json.sha;
            appState.data = JSON.parse(decodeURIComponent(escape(window.atob(json.content))));
            
            renderUI();
        } catch(e) { alert("DB Error: Check credentials in code."); }
    }

    async function saveToGitHub() {
        const url = `https://api.github.com/repos/${SECRET_CONFIG.owner}/${SECRET_CONFIG.repo}/contents/db.json`;

        // Refresh SHA
        try {
            const check = await fetch(url, { headers: { 'Authorization': `token ${SECRET_CONFIG.token}`, 'Cache-Control': 'no-cache' } });
            if(check.ok) appState.sha = (await check.json()).sha;
        } catch(e) {}

        const inv = {
            id: document.getElementById('invNumber').value,
            date: document.getElementById('invDate').value,
            client: document.getElementById('clientDetails').value,
            total: document.getElementById('valGrand').innerText,
            type: document.getElementById('docType').value
        };
        
        if(!appState.data.invoices) appState.data.invoices = [];
        appState.data.invoices.push(inv);

        const body = {
            message: "Save Invoice " + inv.id,
            content: window.btoa(unescape(encodeURIComponent(JSON.stringify(appState.data, null, 2)))),
            sha: appState.sha
        };

        try {
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${SECRET_CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if(!res.ok) throw new Error("Save Failed");
            appState.sha = (await res.json()).content.sha;
            alert("Saved Successfully! ✅");
        } catch(e) { alert(e.message); }
    }

    // --- 4. APP LOGIC ---
    function renderUI() {
        const s = appState.data.settings || {};
        const brand = document.getElementById('brandBox');
        if(s.logo) brand.innerHTML = `<img src="${s.logo}" style="height:60px;">`;
        else if(s.company) brand.innerHTML = `<h1>${s.company}</h1>`;
        
        if(s.address) document.getElementById('senderBox').innerHTML = `<p><strong>${s.company}</strong><br>${s.address.replace(/\n/g, '<br>')}</p>`;
        
        document.getElementById('footerBox').innerHTML = `
            <div><strong>Bank</strong><br>${s.bank || ''}<br>${s.iban || ''}</div>
            <div><strong>Tax</strong><br>${s.taxId || ''}<br>${s.vatId || ''}</div>
            <div><strong>Contact</strong><br>${s.contact ? s.contact.replace(/\n/g, '<br>') : ''}</div>
        `;

        // Product Autocomplete
        const oldDl = document.getElementById('productList');
        if(oldDl) oldDl.remove();
        const dl = document.createElement('datalist');
        dl.id = 'productList';
        (appState.data.products || []).forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.dataset.price = p.price;
            dl.appendChild(opt);
        });
        document.body.appendChild(dl);

        const sel = document.getElementById('clientSelect');
        sel.innerHTML = '<option value="">-- Clients --</option>';
        (appState.data.clients || []).forEach((c, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = c.split('\n')[0];
            sel.appendChild(opt);
        });
    }

    function addItem() {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" list="productList" onchange="fillPrice(this)" placeholder="Item"></td>
            <td><input type="number" value="1" oninput="calc()" style="text-align:right"></td>
            <td><input type="number" step="0.01" oninput="calc()" style="text-align:right"></td>
            <td style="text-align:right" class="row-tot">0.00 €</td>
            <td class="no-print"><button onclick="this.closest('tr').remove(); calc()" style="color:red; border:none; background:none;">X</button></td>
        `;
        document.getElementById('itemsBody').appendChild(tr);
    }

    function fillPrice(input) {
        const list = document.getElementById('productList');
        const found = Array.from(list.options).find(o => o.value === input.value);
        if(found) {
            input.closest('tr').querySelectorAll('input')[2].value = found.dataset.price;
            calc();
        }
    }

    function calc() {
        const mode = document.getElementById('taxMode').value;
        let total = 0;
        
        document.querySelectorAll('#itemsBody tr').forEach(row => {
            const inputs = row.querySelectorAll('input');
            const sum = (parseFloat(inputs[1].value) || 0) * (parseFloat(inputs[2].value) || 0);
            row.querySelector('.row-tot').innerText = sum.toFixed(2) + ' €';
            total += sum;
        });

        // Tax Logic
        let taxRate = 0;
        let legal = "";
        const rowTax = document.getElementById('rowTax');

        if(mode === 'klein') {
            taxRate = 0;
            legal = "Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.";
            rowTax.style.display = 'none';
        } else if(mode === 'international') {
            taxRate = 0;
            legal = "Tax Free Export / Reverse Charge.";
            rowTax.style.display = 'none';
        } else {
            taxRate = 0.19;
            legal = "";
            rowTax.style.display = 'flex';
        }

        const taxAmt = total * taxRate;
        const grand = total + taxAmt;

        document.getElementById('valNet').innerText = total.toFixed(2) + ' €';
        document.getElementById('valTax').innerText = taxAmt.toFixed(2) + ' €';
        document.getElementById('valGrand').innerText = grand.toFixed(2) + ' €';
        document.getElementById('legalText').innerText = legal;
    }

    function loadClient() {
        const idx = document.getElementById('clientSelect').value;
        if(idx !== "") document.getElementById('clientDetails').value = appState.data.clients[idx];
    }
    
    function quickSaveClient() {
        const txt = document.getElementById('clientDetails').value;
        if(txt) {
            if(!appState.data.clients) appState.data.clients = [];
            appState.data.clients.push(txt);
            renderUI();
        }
    }
    
    function updateUI() { document.getElementById('displayDocType').innerText = document.getElementById('docType').value.toUpperCase(); }
</script>
</body>
</html>
