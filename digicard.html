    <style>
        :root {
            --primary: #006064;
            --accent: #00BCD4;
            --bg: #f4f7f6;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px; /* Limits width to look like phone on desktop */
            background: var(--white);
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* HEADER IMAGE */
        .header-bg {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #006064 0%, #004d50 100%);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            position: relative;
        }

        /* PROFILE PICTURE */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--white);
            box-shadow: var(--shadow);
            object-fit: cover;
            margin-top: -60px; /* Pulls it up into header */
            background: #fff;
            position: relative;
            z-index: 10;
        }

        /* TEXT INFO */
        .info-section { padding: 20px; }
        .name { font-size: 24px; font-weight: 800; color: #1a1a1a; margin: 10px 0 5px 0; }
        .title { font-size: 14px; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .company { font-size: 12px; color: #888; margin-bottom: 20px; }

        /* ACTION BUTTONS */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 85%;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn:active { transform: scale(0.98); }

        /* Save Contact Button (Primary) */
        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
        }
        .btn-save svg { margin-right: 10px; fill: white; width: 20px; height: 20px; }

        /* Website Button (Secondary) */
        .btn-web {
            background: white;
            color: #333;
            border: 1px solid #eee;
        }
        .btn-web svg { margin-right: 10px; fill: #333; width: 20px; height: 20px; }

        /* LINKS GRID (Whatsapp, Email, etc) */
        .grid-links {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 3 columns */
            gap: 15px;
            width: 85%;
            margin-bottom: 40px;
        }

        .icon-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: #555;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .icon-box:hover { background: #eef1f2; }
        .icon-box svg { width: 24px; height: 24px; fill: var(--primary); }

        /* FOOTER */
        .footer {
            margin-top: auto;
            padding: 20px;
            font-size: 11px;
            color: #aaa;
            border-top: 1px solid #f0f0f0;
            width: 100%;
            box-sizing: border-box;
        }

    </style>
</head>
