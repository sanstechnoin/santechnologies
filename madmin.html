<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAN Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary:#006064; --bg:#f0f2f5; --sidebar:#1a1a1a; --text:#333; --white:#fff; }
        body { font-family:'Segoe UI', sans-serif; background:var(--bg); margin:0; display:flex; height:100vh; color:var(--text); }
        .sidebar { width:250px; background:var(--sidebar); color:white; padding:20px; display:flex; flex-direction:column; }
        .nav-item { padding:12px; cursor:pointer; color:#aaa; display:flex; gap:10px; }
        .nav-item.active { background:var(--primary); color:white; border-radius:6px; }
        .main { flex:1; display:none; flex-direction:column; overflow:hidden; }
        .header { background:white; padding:15px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; }
        .content { padding:20px; overflow-y:auto; }
        .card { background:white; padding:20px; border-radius:8px; margin-bottom:20px; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        input, textarea { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; margin-top:5px; }
        .btn { padding:10px 20px; background:var(--primary); color:white; border:none; cursor:pointer; border-radius:4px; }
        .pin-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); z-index:9999; display:flex; justify-content:center; align-items:center; }
        .pin-card { background:white; padding:30px; border-radius:12px; text-align:center; }
        .tab-view { display:none; } .tab-view.active { display:block; }
        .data-table { width:100%; border-collapse:collapse; } .data-table td, .data-table th { padding:10px; text-align:left; border-bottom:1px solid #eee; }
        .badge-inv { background:#e3f2fd; color:#0277bd; padding:2px 6px; border-radius:4px; font-size:12px; }
        @media(max-width:768px) { body{flex-direction:column;} .sidebar{display:none;} .form-grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>

<div class="pin-overlay" id="pinScreen">
    <div class="pin-card">
        <h2>SAN Admin</h2>
        <input type="tel" id="pinInput" placeholder="PIN" style="font-size:20px; text-align:center;">
        <button class="btn" style="margin-top:10px; width:100%" onclick="checkPin()">Login</button>
    </div>
</div>

<div class="sidebar">
    <h3>SAN Admin</h3>
    <div class="nav-item active" onclick="tab('settings')">Settings</div>
    <div class="nav-item" onclick="tab('products')">Products</div>
    <div class="nav-item" onclick="tab('clients')">Clients</div>
    <div class="nav-item" onclick="tab('invoices')">Invoices</div>
</div>

<div class="main" id="mainApp">
    <div class="header">
        <h2>Dashboard</h2>
        <button class="btn" onclick="saveData()">Save Changes</button>
    </div>
    <div class="content">
        <div id="settings" class="tab-view active">
            <div class="card"><h3>Branding</h3><div class="form-grid"><div><label>Company</label><input id="setCompany"></div><div><label>Logo URL</label><input id="setLogo"></div></div></div>
            <div class="card"><h3>Bank & Tax</h3><div class="form-grid"><div><label>Bank</label><input id="setBank"></div><div><label>IBAN</label><input id="setIban"></div><div><label>BIC</label><input id="setBic"></div><div><label>Tax ID</label><input id="setTaxId"></div><div><label>VAT ID</label><input id="setVatId"></div></div></div>
            <div class="card"><h3>Contact</h3><div class="form-grid"><div><label>Address</label><textarea id="setAddress" rows="3"></textarea></div><div><label>Contact Info</label><textarea id="setContact" rows="3"></textarea></div></div></div>
        </div>

        <div id="products" class="tab-view">
            <div class="card"><h3>Catalog</h3><button class="btn" onclick="addProd()">+ Product</button><div id="prodList"></div></div>
        </div>

        <div id="clients" class="tab-view">
            <div class="card"><h3>Clients</h3><textarea id="newClient" placeholder="Paste Client Address"></textarea><button class="btn" onclick="addClient()" style="margin-top:5px;">Add</button><div id="clientList" style="margin-top:20px;"></div></div>
        </div>

        <div id="invoices" class="tab-view">
            <div class="card">
                <h3>Invoice History</h3>
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Date</th><th>Client</th><th>Total</th><th>Status</th></tr></thead>
                    <tbody id="invoiceList"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    /* --- CONFIG --- */
    const PART_A = "ghp_"; 
    const PART_B = "73jw2WArl7kWDwJLT459odX9czQLd63PAEPi"; 
    const CONFIG = { owner: "santechnoin", repo: "billing-db", token: PART_A + PART_B };
    
    let appState = { data: { settings:{}, products:[], clients:[], invoices:[] }, fileSha: null };

    function checkPin() {
        if(document.getElementById('pinInput').value === "110327") {
            document.getElementById('pinScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            fetchData();
        } else alert("Wrong PIN");
    }

    async function fetchData() {
        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/db.json`, {
                headers: { 'Authorization': `token ${CONFIG.token}` }
            });
            if(res.status === 404) return;
            const json = await res.json();
            appState.fileSha = json.sha;
            appState.data = JSON.parse(decodeURIComponent(escape(window.atob(json.content))));
            render();
        } catch(e) { alert("Conn Error"); }
    }

    async function saveData() {
        // Settings
        appState.data.settings = {
            company: document.getElementById('setCompany').value,
            logo: document.getElementById('setLogo').value,
            bank: document.getElementById('setBank').value,
            iban: document.getElementById('setIban').value,
            bic: document.getElementById('setBic').value,
            taxId: document.getElementById('setTaxId').value,
            vatId: document.getElementById('setVatId').value,
            address: document.getElementById('setAddress').value,
            contact: document.getElementById('setContact').value
        };
        
        // Products
        appState.data.products = Array.from(document.querySelectorAll('.prod-row')).map(r => ({
            name: r.children[0].value, price: r.children[1].value
        })).filter(p => p.name);

        try {
            const check = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/db.json`, { 
                headers: { 'Authorization': `token ${CONFIG.token}`, 'Cache-Control': 'no-cache' } 
            });
            if(check.ok) appState.fileSha = (await check.json()).sha;

            const body = {
                message: "Admin Save",
                content: window.btoa(unescape(encodeURIComponent(JSON.stringify(appState.data, null, 2)))),
                sha: appState.fileSha
            };

            await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/db.json`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            alert("Saved!");
        } catch(e) { alert("Save Error"); }
    }

    function render() {
        const s = appState.data.settings || {};
        ['Company','Logo','Bank','Iban','Bic','TaxId','VatId','Address','Contact'].forEach(k => {
            if(document.getElementById('set'+k)) document.getElementById('set'+k).value = s[k.toLowerCase().charAt(0) + k.slice(1)] || '';
        });

        // Products
        const pl = document.getElementById('prodList'); pl.innerHTML = '';
        (appState.data.products || []).forEach(p => {
            const d = document.createElement('div'); d.className='prod-row';
            d.innerHTML = `<input value="${p.name}" style="width:60%"> <input value="${p.price}" style="width:20%"> <button onclick="this.parentElement.remove()">X</button>`;
            pl.appendChild(d);
        });

        // Clients
        const cl = document.getElementById('clientList'); cl.innerHTML = '';
        (appState.data.clients || []).forEach((c, i) => {
            const d = document.createElement('div');
            d.innerHTML = `<div style="border:1px solid #eee; padding:10px; margin-bottom:5px; display:flex; justify-content:space-between;">
                <small>${c.replace(/\n/g, ', ')}</small> 
                <button onclick="delClient(${i})" style="background:red; color:white; border:none;">Del</button>
            </div>`;
            cl.appendChild(d);
        });

        // Invoices
        const il = document.getElementById('invoiceList');
        if(il && appState.data.invoices) {
            il.innerHTML = appState.data.invoices.slice().reverse().map(i => `
                <tr>
                    <td><span class="badge-inv">${i.id}</span></td>
                    <td>${i.date}</td>
                    <td>${i.client.split('\n')[0]}</td>
                    <td>${i.total} ${i.currency === 'INR' ? '₹' : '€'}</td>
                    <td style="font-size:12px;">${i.recurring === 'Monthly' ? 'Monthly' : 'One-time'}</td>
                </tr>
            `).join('');
        }
    }

    function addProd() {
        const d = document.createElement('div'); d.className='prod-row';
        d.innerHTML = `<input placeholder="Name" style="width:60%"> <input placeholder="Price" style="width:20%"> <button onclick="this.parentElement.remove()">X</button>`;
        document.getElementById('prodList').appendChild(d);
    }

    function addClient() {
        const v = document.getElementById('newClient').value;
        if(v) { 
            if(!appState.data.clients) appState.data.clients = [];
            appState.data.clients.push(v); 
            document.getElementById('newClient').value = ''; 
            render(); 
        }
    }
    
    function delClient(i) {
        if(confirm("Delete?")) { appState.data.clients.splice(i,1); render(); }
    }

    function tab(id) {
        document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
